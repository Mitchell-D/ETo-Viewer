version: "3"

services:
  eto-api:
    build: ./api
    container_name: eto-api
    ports:
      - "81"
    volumes:
      - ./api/app.py:/app/app.py:ro,Z
      - ./data/store/eto-forecast.zarr:/app/eto-forecast.zarr:Z
      #- ./data/preprocessed_polygons.json:/app/preprocessed_polygons.json:ro,Z
    environment:
      - USERNS_MODE=keep-id
      - LOG_LEVEL=info
      - UVICORN_ACCESS_LOG=true
      - REDIS_URL=redis://eto-apicache:6379
    depends_on:
      - eto-apicache
    networks:
      - eto-backend
    ## neccesary so that zarr store can live in drought group directory
    group_add:
      - keep-groups

  eto-basemap:
    image: ghcr.io/maplibre/martin:latest
    container_name: eto-basemap
    volumes:
      - ./basemap:/data:ro
    command: ["--config", "/data/config.yaml"]
    expose:
      - "3000"
    networks:
      - eto-backend

  eto-apicache:
    image: docker.io/redis:8-alpine
    container_name: eto-apicache
    networks:
      - eto-backend

  eto-dashboard:
    image: nginx:1.28.0
    container_name: eto-dashboard
    ports:
      - "18086:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:Z
      - ./dashboard/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    tmpfs:
      - /var/cache/nginx/eto_data_cache:rw,noexec,nosuid,size=512m
    environment:
      - USERNS_MODE=keep-id
    depends_on:
      - eto-api
      - eto-basemap
    networks:
      - eto-backend

networks:
  eto-backend:
    driver: bridge
    enable_ipv6: false
